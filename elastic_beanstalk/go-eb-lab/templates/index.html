<!DOCTYPE html>
<html>
<head>
    <title>Go Elastic Beanstalk App</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
</head>

<body class="container mt-5">

    <h1 class="mb-4">User Registration</h1>

    <form action="/users" method="POST" class="mb-5">

        <input
          type="text"
          name="name"
          class="form-control mb-3"
          placeholder="Name"
          required
        >

        <input
          type="email"
          name="email"
          class="form-control mb-3"
          placeholder="Email"
          required
        >

        <button class="btn btn-primary">
            Save User
        </button>

    </form>

    <h2>Saved Users</h2>

    <table class="table table-bordered">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
        </tr>

        {{ range .users }}
        <tr>
            <td>{{ .ID }}</td>
            <td>{{ .Name }}</td>
            <td>{{ .Email }}</td>
        </tr>
        {{ end }}

    </table>

</body>
</html>
